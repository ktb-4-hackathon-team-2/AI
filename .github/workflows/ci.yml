name: AI Server CI

on:
  pull_request:
    branches:
      - main
      - test
  push:
    branches:
      - main
      - test

jobs:
  test-and-lint:
    name: Python Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r report-service/requirements.txt
          pip install flake8 pytest

      - name: Syntax & Lint check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 report-service --count --select=E9,F63,F7,F82 --show-source --statistics
          # Python syntax compilation test
          python -m compileall report-service/app

      - name: Run Unit Tests
        run: |
          cd report-service
          python test_report.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'mock-key-for-ci' }}
